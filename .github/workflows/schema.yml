name: schema

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.39.0
      - name: Schema is valid JSON Schema 2020-12
        run: check-jsonschema --check-metaschema schema/1.0/edx.schema.json
      - name: Examples are valid EDX
        run: check-jsonschema --schemafile schema/1.0/edx.schema.json conformance/examples/*.edx.json
