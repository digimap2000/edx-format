[package]
name = "edx-format"
description = "Reference reader, checker and merger for EDX, the Electronics Design eXchange format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["pcb", "eda", "electronics", "exchange", "json-schema"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/edx-format"
# The conformance test reads the suite from the repository, so it is not packaged.
include = ["src/**", "schema/**", "README.md"]

[lib]
name = "edx_format"

[dependencies]
geo = "0.33.1"
jsonschema = { version = "0.60.2", default-features = false }
serde = { workspace = true }
sha2 = "0.10.9"
serde_json = { workspace = true }
