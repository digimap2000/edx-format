[package]
name = "edx-format"
description = "Reference reader, checker and merger for EDX, the Electronics Design eXchange format"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["pcb", "eda", "electronics", "exchange", "json-schema"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/edx-format"
# The conformance test reads the suite from the repository, so it is not packaged.
include = ["src/**", "schema/**", "README.md"]

[lib]
name = "edx_format"

[dependencies]
geo = "0.33.1"
jsonschema = { version = "0.60.2", default-features = false }
serde = { workspace = true }
sha2 = "0.10.9"
serde_json = { workspace = true }

[features]
# Keeps JSON objects' members in the order they were read (serde_json's preserve_order), for
# write_plain and to_string_value: a document read and written back keeps its layout. Off by
# default, because Cargo turns a feature on for a whole build: a dependent's own serde_json would
# change with it. Canonical form, hashes and to_string don't depend on it.
preserve_order = ["serde_json/preserve_order"]
